<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Triage System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="outer"></div>
<div class="module">
<h2>Describe your health issues</h2>
<textarea id="inputText" rows="5" cols="50" placeholder="Enter symptoms..."></textarea>
<br><br>
<button onclick="predict()">Predict</button>
<h3>RESULTS:</h3>
<pre id="output"></pre>
</div>
<script>
async function predict() {
    const text = document.getElementById("inputText").value;

    document.getElementById("output").innerText = "Loading...";

    try {
        const res = await fetch("http://127.0.0.1:8000/predict", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ text: text })
        });

        const data = await res.json();

        document.getElementById("output").innerText =
            "Prediction: " + data.prediction + "\n\n" +
            "Symptoms:\n" + JSON.stringify(data.features, null, 2);

    } catch (err) {
        document.getElementById("output").innerText = "Error: " + err;
    }
}
</script>

</body>
</html>
